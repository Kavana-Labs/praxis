[project]
name = "praxis-execution-service"
version = "0.1.0"
description = "Praxis execution service — runs untrusted scientific Python in an isolated sandbox."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "pydantic>=2",
    "numpy",
    "sympy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
addopts = "-q"
