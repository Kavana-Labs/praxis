# Praxis MVP — web editor + Python execution service.
#
#   docker compose up --build
#     web      → http://localhost:5173   (open /editor)
#     executor → http://localhost:8000
#
# The executor here uses the in-container `subprocess` backend (the scientific stack is
# pre-installed in its image). For per-job container isolation, run the executor on the host
# with the Docker backend — see docs/execution-service.md.
#
# The NestJS `api` and `redis` are scaffolding for the future platform layer and are NOT on the
# MVP path. They only start with:  docker compose --profile platform up

services:
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    depends_on:
      - executor

  executor:
    build:
      context: ./apps/executor
    environment:
      EXECUTOR_BACKEND: subprocess
      EXECUTOR_TIMEOUT_SECONDS: "15"
      EXECUTOR_MAX_MEMORY_MB: "512"
      EXECUTOR_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    profiles: ["platform"]

  api:
    build:
      context: ./apps/api
    ports:
      - "3000:3000"
    depends_on:
      - redis
    profiles: ["platform"]
